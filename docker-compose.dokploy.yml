# IoBuild — Dokploy / Traefik override (no rompe el flujo local).
#
# Filosofia: single-domain. Traefik (provisto por Dokploy) -> nginx:80 interno,
# y nginx mantiene el ruteo actual sin cambios: /api/ -> iobuild-api:8080,
# /health -> iobuild-api:8080, / -> frontend:80.
# Asi no se tocan CORS, VITE_API_URL=/api/v1, ni nginx.conf.
#
# Uso local (validar sin desplegar):
#   docker compose -f docker-compose.yml -f docker-compose.dokploy.yml config
# En Dokploy: usar este archivo como Compose adicional (override) sobre
# docker-compose.yml, o como archivo principal segun la app. No expone 80/443;
# Traefik rutea por labels. Solo mosquitto conserva 1883:1883 para dispositivos
# MQTT externos (HTTP no puede proxear MQTT; alternativa TCP con HostSNI(*) en Next steps).
#
# Vars nuevas: DOMAIN (requerida, ej. app.tudominio.com). El resto se reutiliza
# del .env existente (DB_PASSWORD, JWT_SECRET, CORS_ALLOWED_ORIGINS, Stripe, Cloudinary).

services:
  nginx:
    # Quita el mapeo 80:80 local; en Dokploy el acceso entra por Traefik.
    ports: !reset []
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.iobuild.rule=Host(`${DOMAIN:-app.example.com}`)"
      - "traefik.http.routers.iobuild.entrypoints=websecure"
      - "traefik.http.routers.iobuild.tls.certresolver=letsencrypt"
      - "traefik.http.services.iobuild.loadbalancer.server.port=80"
      - "traefik.docker.network=dokploy-network"
    networks:
      - iobuild-network
      - dokploy-network

  iobuild-api:
    # Quita 8080:8080 + 5080:8080; la API solo es visible via nginx/Traefik.
    ports: !reset []
    networks:
      - iobuild-network

  frontend:
    networks:
      - iobuild-network

  mysql-monolith:
    networks:
      - iobuild-network

  mosquitto:
    # Se conserva 1883:1883 a proposito para dispositivos externos.
    # Si todo es interno (solo api+simulator), comentar el ports via Dokploy UI
    # o agregar aqui `ports: !reset []`.
    networks:
      - iobuild-network

  simulator:
    networks:
      - iobuild-network

networks:
  dokploy-network:
    external: true
